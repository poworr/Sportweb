<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選手を比べる | Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/build-player.css">
<link rel="stylesheet" href="css/lab.css">
<link rel="stylesheet" href="css/fit.css">
<link rel="stylesheet" href="css/retro.css">
</head>
<body class="p-lab p-compare">
  <div class="page">
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="index.html">ホーム</a>
        <nav class="main-nav" aria-label="Main">
          <a href="players.html">選手を知る</a>
          <a href="compare.html" aria-current="page">選手を比べる</a>
          <a href="build-player.html">自分を作る</a>
          <a href="shoot.html">シュート練習</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <p class="eyebrow">選手を比べる</p>
          <h2>この2人、どっちがすごい？</h2>
          <p class="lede">2人を選ぶと、6つの評価と8つの成績を重ねて比べられます。どこで勝っていて、どこで負けているのかを見てみましょう。</p>

          <div class="cmp-pick">
            <label class="cmp-sel cmp-sel--a"><span>選手A</span><select id="cmpA"></select></label>
            <button type="button" class="pill" id="cmpSwap">入れ替える</button>
            <label class="cmp-sel cmp-sel--b"><span>選手B</span><select id="cmpB"></select></label>
          </div>

          <div class="lab lab--cmp card">
            <div class="cmp-left">
              <div class="cmp-radar" id="cmpRadar"></div>
              <div class="legend"><span><i class="you"></i><b id="legA"></b></span><span><i class="them"></i><b id="legB"></b></span></div>
              <p class="note">評価は、1試合あたりの成績から作った0〜99の独自の簡易式によるものです。比較のための目安です。</p>
            </div>
            <div class="cmp-right">
              <div class="cmp-heads">
                <div class="cmp-head cmp-head--a"><a id="cmpLinkA" href="players.html"><b id="cmpNameA"></b></a><span id="cmpStyleA"></span><em id="cmpScoreA"></em></div>
                <div class="cmp-head cmp-head--b"><a id="cmpLinkB" href="players.html"><b id="cmpNameB"></b></a><span id="cmpStyleB"></span><em id="cmpScoreB"></em></div>
              </div>
              <p class="cmp-verdict" id="cmpVerdict"></p>
              <div class="cmp-rows" id="cmpRows"></div>
              <a class="btn btn--primary cmp-cta" id="cmpTarget" href="build-player.html">選手Bを目標にして練習プランを作る →</a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

<script src="js/i18n.js"></script>
<script src="js/player-data.js"></script>
<script src="js/lab.js"></script>
<script src="js/compare.js"></script>
<script src="js/pager.js"></script>
</body>
</html>
