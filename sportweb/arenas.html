<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アリーナ | Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/transition.css">
<link rel="stylesheet" href="css/arenas.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="index.html">Range</a>
        <nav class="main-nav" aria-label="Main">
          <a href="index.html">ホーム</a>
          <a href="shot-map.html">ショットマップ</a>
          <a href="arenas.html" aria-current="page">アリーナ</a>
          <a href="record-night.html">記録の夜</a>
          <a href="build-player.html">選手を作る</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <p class="eyebrow">アリーナ</p>
          <h2>すべての本拠地。大きな夜は3つ。</h2>
          <p class="lede">30チーム、地図上には28か所。オレンジの地点には、すでに記録された試合があります。ほかはゲームログのデータ待ちです。</p>

          <div class="arena-picks">
            <button class="pill" type="button" data-team="nyk">ニューヨーク · 2021年12月</button>
            <button class="pill" type="button" data-team="okc">オクラホマシティ · 2016年2月</button>
            <button class="pill" type="button" data-team="gsw">ベイエリア · 2016年11月</button>
          </div>

          <div class="arena-layout">
            <div class="us-map">
              <svg viewBox="0 0 1000 620" aria-hidden="true">
                <g class="us-grid"><path d="M0 145H1000M0 250H1000M0 355H1000M0 460H1000"/><path d="M200 0V620M400 0V620M600 0V620M800 0V620"/></g>
                <path class="us-outline" id="usOutline" d=""/>
              </svg>
              <div id="stops"></div>
            </div>

            <div class="arena-card">
              <div class="arena-tag" id="arenaTag"></div>
              <h3 id="arenaName"></h3>
              <p class="arena-where" id="arenaWhere"></p>
              <div class="arena-game" id="arenaGame">
                <span class="arena-date" id="arenaDate"></span>
                <span class="arena-result" id="arenaResult"></span>
                <span class="arena-line" id="arenaLine"></span>
                <span class="arena-note" id="arenaNote"></span>
              </div>
              <p class="arena-empty" id="arenaEmpty">この地点の試合は、まだ読み込まれていません。ゲームログが入りしだい、ここでの最高の一夜がこのカードに表示されます。</p>
            </div>
          </div>
          <p class="note arena-footnote">地図は簡略化した輪郭です。ピンは都市の位置にあり、アリーナの正確な場所ではありません。トロントは輪郭のすぐ北にあります。</p>
        </div>
      </section>
    </main>
  </div>

<script src="js/arenas.js"></script>
<script src="js/animation.js"></script>
</body>
</html>
