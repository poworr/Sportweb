      <div class="grid-view">

            <b class="po-title">選手を知る</b>
            <span class="po-art"><svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="200" height="150" fill="#2860c0"/><g fill="none" stroke="#fff" stroke-width="2.2" opacity=".85"><circle cx="100" cy="168" r="70"/><path d="M0 128H200"/></g></svg><img class="po-fig" src="images/players/kobe.webp" alt="" style="left:2%;height:98%;bottom:-2%"><img class="po-fig" src="images/players/curry.webp" alt="" style="left:56%;height:66%;bottom:2%"><img class="po-fig" src="images/players/lebron.webp" alt="" style="left:30%;height:100%;bottom:-2%"><em class="po-tag">LEGENDS</em></span>
            <span class="po-sub">レジェンドと今のスターの強み</span>
          </a>
          <a class="tile poster" href="compare.html">
            <i class="po-sw" aria-hidden="true"></i>
            <b class="po-title">選手を比べる</b>

          </a>

            <span class="po-sub">なりたい選手への道と練習プラン</span>
          </a>

            <span class="po-sub">緑で離して、3ポイントを決める</span>
          </a>
        </nav>
        <p class="tagline"><span class="tagline-tag">NBA PLAYER LAB</span><span class="tagline-text">NBAのレジェンドと今のスターを分析して、自分がなりたい選手への道を見つけよう。</span></p>
        <div class="brand">
          <h1 class="wordmark">RANGE</h1>
          <div class="ball-menu" id="ballMenu">
            <button class="ball-btn" type="button" aria-expanded="false" aria-controls="picks" aria-label="ボールをクリックしてメニューを開く"><svg viewBox="0 0 270 270" aria-hidden="true"><circle cx="165" cy="165" r="100" fill="#2b1511" fill-opacity=".34"/><image href="images/players/ball.webp" x="6" y="6" width="208" height="208"/></svg></button>

        </div>
        </div>
      </div>
    </main>
