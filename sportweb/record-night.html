<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record night | Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/transition.css">
<link rel="stylesheet" href="css/record-night.css">
</head>
<body class="theme-record">
  <div class="page">
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="index.html">Range</a>
        <nav class="main-nav" aria-label="Main">
          <a href="index.html">Home</a>
          <a href="shot-map.html">Shot map</a>
          <a href="arenas.html">Arenas</a>
          <a href="record-night.html" aria-current="page">Record night</a>
          <a href="build-player.html">Build your player</a>
        </nav>
      </div>
    </header>

    <main class="record">
      <section class="section">
        <div class="container">
          <p class="eyebrow">Record night</p>
          <h2>The night he passed Ray Allen.</h2>
          <p class="lede">December 14, 2021, Madison Square Garden. Step through the moments that decided the all-time three-point record.</p>

          <div class="record-layout">
            <div class="story-steps">
            <button class="story-step" type="button">
              <span class="story-time">Before tip-off</span>
              <span class="story-title">Two threes to go.</span>
              <span class="story-body">Ray Allen holds the career record with 2,973 threes. Curry needs two to pass him.</span>
            </button>
            <button class="story-step" type="button">
              <span class="story-time">First quarter</span>
              <span class="story-title">The first three ties it.</span>
              <span class="story-body">His first three of the night ties Allen at 2,973.</span>
            </button>
            <button class="story-step" type="button">
              <span class="story-time">First quarter · 7:33 left</span>
              <span class="story-title">The record is his.</span>
              <span class="story-body">From the right wing, his 2,974th career three breaks the record. Coach Steve Kerr calls a timeout to make room for the celebration.</span>
            </button>
            <button class="story-step" type="button">
              <span class="story-time">The timeout</span>
              <span class="story-title">Allen is in the building.</span>
              <span class="story-body">Allen and Reggie Miller present Curry with a jersey that reads 2,974. Curry hugs Allen, his parents, and his teammates. The Warriors win 105 to 96.</span>
            </button>
            </div>

            <div class="story-board">
              <div class="story-score">
                <div>
                  <span class="story-score-label">Curry career threes</span>
                  <span class="display-num story-count" id="storyCount">2,972</span>
                </div>
                <div class="story-allen">Allen: 2,973</div>
              </div>
              <div class="story-court">
                <svg viewBox="0 0 520 500" role="img" aria-label="A half basketball court seen from above, hoop at the top">
              <rect x="10" y="10" width="500" height="470" rx="14" fill="#efefed" stroke="#d6d6d2" stroke-width="2"/>
              <g fill="none" stroke="#1d1d1f" stroke-width="2" opacity="0.3" stroke-linecap="round">
                <rect x="180" y="10" width="160" height="190"/>
                <path d="M200 200A60 60 0 0 0 320 200"/>
                <path d="M200 200A60 60 0 0 1 320 200" stroke-dasharray="5 7"/>
                <path d="M220 62.5A40 40 0 0 0 300 62.5"/>
                <path d="M40 10V152A237.5 237.5 0 0 0 480 152V10"/>
                <path d="M200 480A60 60 0 0 1 320 480"/>
                <path d="M230 50H290" stroke-width="4"/>
              </g>
              <circle cx="260" cy="62.5" r="9" fill="none" stroke="#ff6a13" stroke-width="3.5"/>
            </svg>
                <span class="story-shot" id="storyShot" hidden></span>
                <span class="story-tag" id="storyTag" hidden>Right wing</span>
              </div>
              <p class="story-foot" id="storyCaption"></p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

<script src="js/record-night.js"></script>
<script src="js/animation.js"></script>
</body>
</html>
